id: code_review
display_name: 코드 리뷰
category: engineering
tags:
  - code
  - review
  - quality
  - security
description: 코드 품질, 보안, 패턴 관점의 구조적 검토
thinking_frame: |
  1) 정확성 — 로직 버그, 엣지케이스 누락
  2) 보안 — 입력 검증, 인젝션, 권한 누락
  3) 설계 — 단일 책임, 중복, 추상화 수준
  4) 가독성 — 네이밍, 주석 필요성, 복잡도
  각 항목은 (위치 → 문제 → 개선 코드 예시) 형식으로.
output_checklist:
  - 파일명:라인번호 형식으로 위치 명시
  - 심각도 Critical/High/Medium/Low 분류
  - 개선 코드 스니펫 포함 (변경 전/후)
  - 칭찬 없이 개선 사항만
input_conditions:
  - diff, 파일 경로, 코드 블록, PR 설명 중 하나 이상 필요
  - 실행 환경이나 테스트 명령이 있으면 함께 반영
output_template:
  - Findings
  - Missing Tests
  - Residual Risks
quality_rubric:
  - 위치 없는 finding은 무효
  - 재현 가능성이나 영향 설명이 없는 지적은 무효
  - 보안/데이터 손실 가능성은 항상 상위 심각도로 배치
