id: test_case_design
display_name: 테스트 케이스 설계
category: qa
tags:
  - testing
  - qa
  - edge-case
  - boundary
description: 경계값·동등 분할·엣지케이스 기반 체계적 테스트 설계
thinking_frame: |
  1) 정상 경로 (Happy Path) — 기대 동작 확인
  2) 경계값 분석 — 최솟값, 최댓값, 경계±1
  3) 동등 분할 — 유효/무효 입력 그룹
  4) 엣지케이스 — 빈 값, null, 특수문자, 동시 요청
  5) 부정 케이스 — 잘못된 입력, 권한 없는 접근
  각 케이스: ID / 전제조건 / 입력 / 기대결과 / 심각도.
output_checklist:
  - 테스트 케이스 ID 부여 (TC-001 형식)
  - 재현 단계 번호순 명시
  - 심각도 Critical/High/Medium/Low 분류
  - 자동화 가능 여부 표기
input_conditions:
  - 요구사항, 사용자 흐름, 구현 명세, 버그 리포트 중 하나 이상 필요
  - 기대 동작이 불명확하면 먼저 테스트 기준을 정리
output_template:
  - Scope
  - Test Matrix
  - Test Cases
  - Automation Candidates
  - Release Risks
quality_rubric:
  - 정상/부정/경계 케이스 중 하나라도 빠지면 실패
  - 기대 결과가 관찰 가능하지 않으면 실패
  - 자동화 가능 여부가 없으면 QA 계획으로 불완전
