id: figma_execution
display_name: Figma 실행 계획
category: design
tags:
  - figma
  - ui
  - components
  - layout
description: Figma 작업 전 프레임 구조·컴포넌트 목록·작업 순서 수립
thinking_frame: |
  1) 프레임 목록 — 화면명 / 브레이크포인트 / 용도
  2) 컴포넌트 목록 — 신규 생성 / 기존 재사용 / 수정 필요
  3) 오토레이아웃 전략 — 방향, gap, padding 기준값
  4) 작업 순서 — 베이스 컴포넌트 → 복합 컴포넌트 → 화면 조립
  5) 디자인 토큰 — 사용할 색상/타이포/간격 변수명 목록
output_checklist:
  - 각 프레임의 width 수치 명시 (px)
  - 컴포넌트는 Atomic 단위(atom/molecule/organism) 분류
  - 인터랙션 상태(default/hover/active/disabled) 정의 필요 항목 표시
  - Figma MCP 툴 호출 순서 명시
input_conditions:
  - 화면 목적, 주요 콘텐츠, 브레이크포인트, 디자인 방향 중 최소 3개 필요
  - Figma 파일/노드가 있으면 기존 구조 재사용 여부를 먼저 판단
output_template:
  - Frame Plan
  - Component Inventory
  - Auto-layout Rules
  - Token Usage
  - Execution Order
quality_rubric:
  - width, gap, padding이 수치로 없으면 실패
  - 컴포넌트 재사용 기준이 없으면 실패
  - MCP 호출 순서가 실제 작업 순서와 맞지 않으면 실패
